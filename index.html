<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToyNest | Kids Toys Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#fff9f5;
    color:#20243a;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1180px;
    margin:auto;
}

/* TOP BAR */
.topbar{
    background:#20243a;
    color:white;
    padding:9px 0;
    font-size:13px;
}

.topbar .container{
    display:flex;
    justify-content:space-between;
}

/* HEADER */
header{
    background:white;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 3px 18px rgba(0,0,0,.08);
}

.nav{
    min-height:76px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:27px;
    font-weight:900;
    color:#ff5b6e;
}

.logo span{
    color:#6c63ff;
}

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    height:45px;
    border:2px solid #eee;
    border-radius:14px;
    padding:0 50px 0 16px;
    outline:none;
}

.search button{
    position:absolute;
    right:5px;
    top:5px;
    width:35px;
    height:35px;
    border:0;
    border-radius:10px;
    background:#6c63ff;
    color:white;
    cursor:pointer;
}

.navlinks{
    display:flex;
    align-items:center;
    gap:18px;
    font-weight:bold;
    font-size:14px;
}

.cartbtn{
    border:0;
    background:#ff5b6e;
    color:white;
    padding:11px 14px;
    border-radius:13px;
    cursor:pointer;
    font-weight:bold;
}

.cart-count{
    background:white;
    color:#ff5b6e;
    padding:2px 6px;
    border-radius:20px;
}

/* HERO */
.hero{
    padding:42px 0 25px;
}

.hero-box{
    background:linear-gradient(120deg,#ffe4e9,#e8e5ff);
    border-radius:30px;
    min-height:390px;
    padding:45px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
}

.badge{
    background:white;
    padding:8px 13px;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
    color:#6c63ff;
}

.hero h1{
    font-size:clamp(40px,5vw,64px);
    line-height:1;
    margin:20px 0;
}

.hero h1 span{
    color:#ff5b6e;
}

.hero p{
    color:#555d70;
    max-width:520px;
    font-size:17px;
}

.hero-actions{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:0;
    border-radius:14px;
    padding:13px 20px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#ff5b6e;
    color:white;
}

.btn-dark{
    background:#20243a;
    color:white;
}

.hero-art{
    height:310px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.toy-orbit{
    width:270px;
    height:270px;
    border-radius:50%;
    background:#ffffffaa;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:120px;
    box-shadow:0 12px 35px rgba(32,36,58,.1);
}

.float{
    position:absolute;
    background:white;
    padding:13px 16px;
    border-radius:16px;
    box-shadow:0 12px 35px rgba(32,36,58,.1);
    font-weight:bold;
}

.f1{
    top:10px;
    right:12px;
}

.f2{
    bottom:20px;
    left:0;
}

.f3{
    top:85px;
    left:5px;
}

/* FEATURES */
.features{
    padding:15px 0 35px;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.feature{
    background:white;
    padding:18px;
    border-radius:18px;
    display:flex;
    gap:12px;
    align-items:center;
}

.feature span{
    font-size:25px;
}

.feature small{
    display:block;
    color:#697386;
}

/* SECTIONS */
.section{
    padding:30px 0;
}

.section-head{
    margin-bottom:18px;
}

.section-head h2{
    font-size:30px;
}

.section-head p{
